<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quest Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.0/flowbite.min.css" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#1f1f20',
                            dark: '#202020',
                            gold: '#FEBD11',
                            yellow: '#fdbd16',
                            red: '#f31e21',
                            gray: '#585858',
                            light: '#e3c293',
                            orange: '#ef6d1f'
                        }
                    },
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'],
                    },
                    boxShadow: {
                        'neon-gold': '0 0 10px rgba(254, 189, 17, 0.5), 0 0 20px rgba(254, 189, 17, 0.3)',
                        'neon-red': '0 0 10px rgba(243, 30, 33, 0.5), 0 0 20px rgba(243, 30, 33, 0.3)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1f1f20;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(254, 189, 17, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(243, 30, 33, 0.05) 0%, transparent 50%);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Cyberpunk Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1f1f20;
        }

        ::-webkit-scrollbar-thumb {
            background: #585858;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #FEBD11;
        }

        .glass-panel {
            background: rgba(31, 31, 32, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bottom-nav {
            background: rgba(31, 31, 32, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(254, 189, 17, 0.2);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
        }

        .nav-item.active {
            color: #FEBD11;
            text-shadow: 0 0 10px rgba(254, 189, 17, 0.6);
        }

        .nav-item.active i {
            transform: translateY(-2px);
        }

        /* Safe area for iPhone home indicator */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Arc Reactor Loading Spinner */
        .arc-reactor-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .svg-frame {
            position: relative;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: reactorRotate 4s linear infinite;
        }

        .svg-frame svg {
            position: absolute;
            transition: .5s;
            z-index: calc(1 - (0.2 * var(--j)));
            transform-origin: center;
            width: 344px;
            height: 344px;
            fill: none;
        }

        .svg-frame svg #center {
            transition: .5s;
            transform-origin: center;
            fill: #FEBD11;
            stroke: #FEBD11;
            stroke-width: 2;
            filter: drop-shadow(0 0 10px #FEBD11) drop-shadow(0 0 20px #FEBD11);
        }

        .svg-frame svg path {
            stroke: #FEBD11;
            stroke-width: 3;
            transition: .5s;
            opacity: calc(1 - (0.15 * var(--j)));
            filter: drop-shadow(0 0 5px #FEBD11);
            stroke-dasharray: 800;
            stroke-dashoffset: 800;
            animation: drawCircle 3s ease-in-out forwards, glowPulse 2s ease-in-out infinite;
            animation-delay: calc(0.3s * var(--j));
        }

        .loading-text {
            color: #FEBD11;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-shadow:
                0 0 10px #FEBD11,
                0 0 20px #FEBD11;
            animation: textGlow 1.5s ease-in-out infinite;
        }

        @keyframes reactorRotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes drawCircle {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes glowPulse {

            0%,
            100% {
                filter: drop-shadow(0 0 5px #FEBD11);
                opacity: calc(1 - (0.15 * var(--j)));
            }

            50% {
                filter: drop-shadow(0 0 15px #FEBD11) drop-shadow(0 0 25px #FEBD11);
                opacity: calc(1 - (0.08 * var(--j)));
            }
        }

        @keyframes textGlow {

            0%,
            100% {
                text-shadow:
                    0 0 10px #FEBD11,
                    0 0 20px #FEBD11;
            }

            50% {
                text-shadow:
                    0 0 20px #FEBD11,
                    0 0 40px #FEBD11,
                    0 0 60px #FEBD11;
            }
        }

        .arc-reactor {
            position: relative;
            width: 120px;
            height: 120px;
            animation: reactorPulse 2s ease-in-out infinite;
        }

        .arc-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #FEBD11, #fdbd16);
            border-radius: 50%;
            box-shadow:
                0 0 20px #FEBD11,
                0 0 40px #FEBD11,
                0 0 60px #FEBD11,
                inset 0 0 20px #fff;
            animation: corePulse 1.5s ease-in-out infinite;
        }

        .arc-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .arc-ring-1 {
            width: 60px;
            height: 60px;
            margin-top: -30px;
            margin-left: -30px;
            border-top-color: #FEBD11;
            border-right-color: #FEBD11;
            box-shadow: 0 0 15px #FEBD11;
            animation: spinClockwise 2s linear infinite;
        }

        .arc-ring-2 {
            width: 90px;
            height: 90px;
            margin-top: -45px;
            margin-left: -45px;
            border-bottom-color: #fdbd16;
            border-left-color: #fdbd16;
            box-shadow: 0 0 20px #fdbd16;
            animation: spinCounterClockwise 3s linear infinite;
        }

        .arc-ring-3 {
            width: 120px;
            height: 120px;
            margin-top: -60px;
            margin-left: -60px;
            border-top-color: #e3c293;
            border-right-color: #e3c293;
            box-shadow: 0 0 25px #e3c293;
            animation: spinClockwise 4s linear infinite;
        }

        .arc-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FEBD11;
            border-radius: 50%;
            box-shadow: 0 0 10px #FEBD11;
        }

        .arc-particle-1 {
            top: 0;
            left: 50%;
            animation: orbit1 3s linear infinite;
        }

        .arc-particle-2 {
            top: 50%;
            right: 0;
            animation: orbit2 3s linear infinite;
        }

        .arc-particle-3 {
            bottom: 0;
            left: 50%;
            animation: orbit3 3s linear infinite;
        }

        .arc-particle-4 {
            top: 50%;
            left: 0;
            animation: orbit4 3s linear infinite;
        }

        .loading-text {
            color: #FEBD11;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-shadow:
                0 0 10px #FEBD11,
                0 0 20px #FEBD11;
            animation: textGlow 1.5s ease-in-out infinite;
        }

        @keyframes reactorPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes corePulse {

            0%,
            100% {
                box-shadow:
                    0 0 20px #FEBD11,
                    0 0 40px #FEBD11,
                    0 0 60px #FEBD11,
                    inset 0 0 20px #fff;
            }

            50% {
                box-shadow:
                    0 0 30px #FEBD11,
                    0 0 60px #FEBD11,
                    0 0 90px #FEBD11,
                    inset 0 0 30px #fff;
            }
        }

        @keyframes spinClockwise {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        @keyframes spinCounterClockwise {
            from {
                transform: translate(-50%, -50%) rotate(360deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(0deg);
            }
        }

        @keyframes orbit1 {
            from {
                transform: translate(-50%, -50%) rotate(0deg) translateX(60px);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg) translateX(60px);
            }
        }

        @keyframes orbit2 {
            from {
                transform: translate(-50%, -50%) rotate(90deg) translateX(60px);
            }

            to {
                transform: translate(-50%, -50%) rotate(450deg) translateX(60px);
            }
        }

        @keyframes orbit3 {
            from {
                transform: translate(-50%, -50%) rotate(180deg) translateX(60px);
            }

            to {
                transform: translate(-50%, -50%) rotate(540deg) translateX(60px);
            }
        }

        @keyframes orbit4 {
            from {
                transform: translate(-50%, -50%) rotate(270deg) translateX(60px);
            }

            to {
                transform: translate(-50%, -50%) rotate(630deg) translateX(60px);
            }
        }

        @keyframes textGlow {

            0%,
            100% {
                text-shadow:
                    0 0 10px #FEBD11,
                    0 0 20px #FEBD11;
            }

            50% {
                text-shadow:
                    0 0 20px #FEBD11,
                    0 0 40px #FEBD11,
                    0 0 60px #FEBD11;
            }
        }
    </style>
</head>

<body class="pb-24 pt-20 antialiased selection:bg-cyber-gold selection:text-cyber-black">
    <!-- Arc Reactor Loading Spinner -->
    <div id="arcReactorLoader"
        class="fixed inset-0 z-[100] flex items-center justify-center bg-cyber-black/95 backdrop-blur-md"
        style="display: none;">
        <div class="arc-reactor-container">
            <div class="relative flex items-center justify-center">
                <img src="{{ url_for('static', filename='images/bt-logo-circle.png') }}"
                    class="absolute z-10 w-14 h-14 object-contain rounded-full drop-shadow-[0_0_10px_rgba(254,189,17,0.8)]"
                    alt="Loading...">
                <div class="svg-frame">
                    <svg style="--i: 0; --j: 0" viewBox="0 0 344 344">
                        <path d="M172 50 a122 122 0 1 1 0 244 a122 122 0 1 1 0 -244" stroke-width="3"></path>
                    </svg>
                    <svg style="--i: 1; --j: 1" viewBox="0 0 344 344">
                        <path d="M172 70 a102 102 0 1 1 0 204 a102 102 0 1 1 0 -204" stroke-width="3"></path>
                    </svg>
                    <svg style="--i: 2; --j: 2" viewBox="0 0 344 344">
                        <path d="M172 90 a82 82 0 1 1 0 164 a82 82 0 1 1 0 -164" stroke-width="3"></path>
                    </svg>
                    <svg style="--i: -1; --j: 3" viewBox="0 0 344 344">
                        <path d="M172 110 a62 62 0 1 1 0 124 a62 62 0 1 1 0 -124" stroke-width="3"></path>
                    </svg>
                    <svg style="--i: -2; --j: 4" viewBox="0 0 344 344">
                        <path d="M172 130 a42 42 0 1 1 0 84 a42 42 0 1 1 0 -84" stroke-width="3"></path>
                    </svg>
                </div>
            </div>
            <p class="loading-text">LOADING...</p>
        </div>
    </div>
    <!-- Fixed Header -->
    <header
        class="fixed top-0 left-0 right-0 z-40 glass-panel h-16 flex items-center justify-center border-b border-white/5 shadow-lg">
        <div class="container mx-auto px-4 flex items-center justify-start">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="BRGY TAMAGO"
                class="h-12 w-auto object-contain filter drop-shadow-[0_0_5px_rgba(254,189,17,0.5)]">
        </div>
    </header>

    <div class="container mx-auto px-4 py-6 animate-fade-in">
        {% block content %}{% endblock %}
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav fixed bottom-0 w-full z-50 pb-safe">
        <div class="flex justify-around items-center h-16 px-2">
            <a href="{{ url_for('main.index') }}"
                class="nav-item flex flex-col items-center justify-center w-full h-full space-y-1 text-gray-400 hover:text-cyber-gold transition-all duration-300 group {{ 'active' if request.endpoint == 'main.index' }}">
                <i class="fas fa-home text-xl group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-bold tracking-wider uppercase">Home</span>
            </a>

            <a href="{{ url_for('quests.list_quests') }}"
                class="nav-item flex flex-col items-center justify-center w-full h-full space-y-1 text-gray-400 hover:text-cyber-gold transition-all duration-300 group {{ 'active' if request.endpoint == 'quests.list_quests' }}">
                <i class="fas fa-scroll text-xl group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-bold tracking-wider uppercase">Quests</span>
            </a>

            <!-- Center Action Button -->
            <div class="relative -top-6">
                <a href="{{ url_for('rewards.list_rewards') }}"
                    class="flex items-center justify-center w-14 h-14 rounded-full bg-gradient-to-r from-cyber-red to-red-600 shadow-neon-red border-4 border-cyber-black transform hover:scale-105 transition-all duration-300">
                    <i class="fas fa-gift text-white text-xl"></i>
                </a>
            </div>

            <a href="{{ url_for('rewards.list_rewards') }}"
                class="nav-item flex flex-col items-center justify-center w-full h-full space-y-1 text-gray-400 hover:text-cyber-gold transition-all duration-300 group {{ 'active' if request.endpoint == 'rewards.list_rewards' }}">
                <i class="fas fa-trophy text-xl group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-bold tracking-wider uppercase">Rewards</span>
            </a>

            <a href="{{ url_for('main.leaderboard') }}"
                class="nav-item flex flex-col items-center justify-center w-full h-full space-y-1 text-gray-400 hover:text-cyber-gold transition-all duration-300 group {{ 'active' if request.endpoint == 'main.leaderboard' }}">
                <i class="fas fa-chart-line text-xl group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-bold tracking-wider uppercase">Rank</span>
            </a>
        </div>
    </nav>

    <!-- Global Modal (Flowbite styled) -->
    <div id="globalModal" tabindex="-1" aria-hidden="true"
        class="fixed top-0 left-0 right-0 z-[60] hidden w-full p-4 overflow-x-hidden overflow-y-auto md:inset-0 h-[calc(100%-1rem)] max-h-full flex items-center justify-center backdrop-blur-sm bg-black/50">
        <div class="relative w-full max-w-md max-h-full">
            <!-- Modal content -->
            <div class="relative bg-cyber-black rounded-xl border border-cyber-gold/30 shadow-2xl shadow-cyber-gold/10">
                <!-- Modal header -->
                <div class="flex items-center justify-between p-4 md:p-5 border-b border-white/10 rounded-t">
                    <h3 class="text-xl font-bold text-white flex items-center gap-2" id="modalTitle">
                        <i class="fas fa-info-circle text-cyber-gold"></i>
                        Notification
                    </h3>
                    <button type="button" onclick="hideModal()"
                        class="text-gray-400 bg-transparent hover:bg-gray-700 hover:text-white rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center">
                        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                        </svg>
                        <span class="sr-only">Close modal</span>
                    </button>
                </div>
                <!-- Modal body -->
                <div class="p-4 md:p-5 space-y-4">
                    <p class="text-base leading-relaxed text-gray-300" id="modalMessage">
                        Message goes here...
                    </p>
                </div>
                <!-- Modal footer -->
                <div class="flex items-center p-4 md:p-5 border-t border-white/10 rounded-b">
                    <button type="button" id="modalOkBtn" onclick="hideModal()"
                        class="w-full text-cyber-black bg-cyber-gold hover:bg-cyber-yellow focus:ring-4 focus:outline-none focus:ring-cyber-gold/50 font-bold rounded-lg text-sm px-5 py-2.5 text-center uppercase tracking-wider transition-all">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.0/flowbite.min.js"></script>
    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Theme Colors for JS usage
        tg.setHeaderColor('#1f1f20');
        tg.setBackgroundColor('#1f1f20');

        // Modal Logic
        const modalElement = document.getElementById('globalModal');
        const titleEl = document.getElementById('modalTitle');
        const messageEl = document.getElementById('modalMessage');
        let currentCallback = null;

        function showModal(title, message, callback) {
            // Update title text but keep icon
            const icon = titleEl.querySelector('i');
            titleEl.innerHTML = '';
            if (icon) titleEl.appendChild(icon);
            titleEl.appendChild(document.createTextNode(' ' + title));

            messageEl.textContent = message;
            currentCallback = callback;

            modalElement.classList.remove('hidden');
            modalElement.classList.add('flex');
        }

        function hideModal() {
            modalElement.classList.add('hidden');
            modalElement.classList.remove('flex');

            if (currentCallback) {
                currentCallback();
                currentCallback = null;
            }
        }

        // Arc Reactor Loader Functions
        const loaderElement = document.getElementById('arcReactorLoader');

        function showLoader() {
            if (loaderElement) {
                loaderElement.style.display = 'flex';
            }
        }

        function hideLoader() {
            if (loaderElement) {
                loaderElement.style.display = 'none';
            }
        }

        // Show loader on page navigation
        document.addEventListener('DOMContentLoaded', () => {
            // Hide loader when page fully loads
            hideLoader();

            // Show loader when clicking navigation links
            document.querySelectorAll('a:not([target="_blank"])').forEach(link => {
                link.addEventListener('click', (e) => {
                    const href = link.getAttribute('href');
                    // Only show loader for internal navigation
                    if (href && !href.startsWith('#') && !href.startsWith('javascript:')) {
                        showLoader();
                    }
                });
            });
        });

        // Intercept fetch requests to show loader
        const originalFetch = window.fetch;
        window.fetch = function (...args) {
            showLoader();
            return originalFetch.apply(this, args)
                .finally(() => {
                    setTimeout(hideLoader, 300); // Small delay for smooth UX
                });
        };
    </script>
</body>

</html>
