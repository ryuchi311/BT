version: '3.8'

services:
  web:
    build: .
    container_name: quest-hub-web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=postgresql://questuser:questpass@db:5432/questdb
      - SQLALCHEMY_DATABASE_URI=postgresql://questuser:questpass@db:5432/questdb
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./instance:/app/instance
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - quest-network

  db:
    image: postgres:15-alpine
    container_name: quest-hub-db
    environment:
      - POSTGRES_USER=questuser
      - POSTGRES_PASSWORD=questpass
      - POSTGRES_DB=questdb
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U questuser -d questdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quest-network
    ports:
      - "5432:5432" # Expose for debugging (remove in production)

networks:
  quest-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
